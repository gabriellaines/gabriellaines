<svg width="495" height="195" viewBox="0 0 495 195"
     fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Contribution Streak">
  <title>Contribution Streak</title>
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #78a9ff; }
    .label { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #c6c6c6; }
    .value { font: 700 14px 'Segoe UI', Ubuntu, sans-serif; fill: #f4f4f4; }
    .small { font: 600 12px 'Segoe UI', Ubuntu, sans-serif; fill: #858585; }
    .big   { font: 800 28px 'Segoe UI', Ubuntu, sans-serif; fill: #f4f4f4; }
  </style>
  <rect x="0.5" y="0.5" width="494" height="194"
        rx="8" fill="#161616" stroke="#393939"/>
  <text x="25" y="35" class="title">Contribution Streak</text>
  <line x1="165" y1="45" x2="165" y2="170"
           stroke="#393939" stroke-width="1"/><line x1="330" y1="45" x2="330" y2="170"
           stroke="#393939" stroke-width="1"/>
<g transform="translate(82.5, 86)" text-anchor="middle">
      
      <text y="0" style="font: 800 28px 'Segoe UI', Ubuntu, sans-serif; fill: #f4f4f4">725</text>
      <text y="28" class="label">Total Contributions</text>
      <text y="50" class="small">Jun 9, 2023 – Present</text>
    </g>
<g transform="translate(247.5, 86)" text-anchor="middle">
      <circle cx="0" cy="-4" r="38" fill="none" stroke="#78a9ff" stroke-width="2" opacity="0.5"/>
      <text y="0" style="font: 800 28px 'Segoe UI', Ubuntu, sans-serif; fill: #be95ff">5</text>
      <text y="28" class="label">Current Streak</text>
      <text y="50" class="small">Oct 5 – Oct 9</text>
    </g>
<g transform="translate(412.5, 86)" text-anchor="middle">
      
      <text y="0" style="font: 800 28px 'Segoe UI', Ubuntu, sans-serif; fill: #f4f4f4">11</text>
      <text y="28" class="label">Longest Streak</text>
      <text y="50" class="small">Mar 17 – Mar 27</text>
    </g>
</svg>
