<svg width="340" height="178" viewBox="0 0 340 178"
     fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #78a9ff; }
    .label { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #c6c6c6; }
    .value { font: 700 14px 'Segoe UI', Ubuntu, sans-serif; fill: #f4f4f4; }
    .small { font: 600 12px 'Segoe UI', Ubuntu, sans-serif; fill: #858585; }
    .big   { font: 800 28px 'Segoe UI', Ubuntu, sans-serif; fill: #f4f4f4; }
  </style>
  <rect x="0.5" y="0.5" width="339" height="177"
        rx="8" fill="#161616" stroke="#393939"/>
  <text x="25" y="35" class="title">Most Used Languages</text>
  <g transform="translate(25, 55)">
      <clipPath id="barClip">
        <rect x="0" y="0" width="290" height="8" rx="4"/>
      </clipPath>
      <g clip-path="url(#barClip)"><rect x="0.00" y="0" width="130.19"
        height="8" fill="#3572A5"/><rect x="130.19" y="0" width="61.50"
        height="8" fill="#44a51c"/><rect x="191.70" y="0" width="42.16"
        height="8" fill="#3178c6"/><rect x="233.86" y="0" width="25.00"
        height="8" fill="#e34c26"/><rect x="258.86" y="0" width="14.16"
        height="8" fill="#f1e05a"/><rect x="273.02" y="0" width="10.84"
        height="8" fill="#c6538c"/><rect x="283.86" y="0" width="5.72"
        height="8" fill="#89e051"/><rect x="289.58" y="0" width="0.42"
        height="8" fill="#427819"/></g>
    </g>
    <g transform="translate(25, 90)"><g transform="translate(0, 0)">
      <circle cx="5" cy="-4" r="5" fill="#3572A5"/>
      <text x="16" y="0" class="label">Python</text>
      <text x="100" y="0" class="small">44.9%</text>
    </g>
<g transform="translate(150, 0)">
      <circle cx="5" cy="-4" r="5" fill="#44a51c"/>
      <text x="16" y="0" class="label">QML</text>
      <text x="100" y="0" class="small">21.2%</text>
    </g>
<g transform="translate(0, 22)">
      <circle cx="5" cy="-4" r="5" fill="#3178c6"/>
      <text x="16" y="0" class="label">TypeScript</text>
      <text x="100" y="0" class="small">14.5%</text>
    </g>
<g transform="translate(150, 22)">
      <circle cx="5" cy="-4" r="5" fill="#e34c26"/>
      <text x="16" y="0" class="label">HTML</text>
      <text x="100" y="0" class="small">8.6%</text>
    </g>
<g transform="translate(0, 44)">
      <circle cx="5" cy="-4" r="5" fill="#f1e05a"/>
      <text x="16" y="0" class="label">JavaScript</text>
      <text x="100" y="0" class="small">4.9%</text>
    </g>
<g transform="translate(150, 44)">
      <circle cx="5" cy="-4" r="5" fill="#c6538c"/>
      <text x="16" y="0" class="label">SCSS</text>
      <text x="100" y="0" class="small">3.7%</text>
    </g>
<g transform="translate(0, 66)">
      <circle cx="5" cy="-4" r="5" fill="#89e051"/>
      <text x="16" y="0" class="label">Shell</text>
      <text x="100" y="0" class="small">2.0%</text>
    </g>
<g transform="translate(150, 66)">
      <circle cx="5" cy="-4" r="5" fill="#427819"/>
      <text x="16" y="0" class="label">Makefile</text>
      <text x="100" y="0" class="small">0.1%</text>
    </g></g>
</svg>
